<script>

const fmt=n=>Number(n).toLocaleString('ko-KR');
const missing=()=>'<span class="text-muted">정보 미확인</span>';
const tag=(v,style='')=>`<span class="tag ${style}">${safe(v)}</span>`;
const source=s=>sourceMap[s]||null;
const schoolById=id=>all.find(s=>s.id===id);
const summary=(s)=>s.programs.length?`${s.programs.filter(p=>p.status==='CONFIRMED').slice(0,2).map(p=>p.name).join(' · ')||'과거 교육과정 참고'}${s.programs.length>2?' 외':''}`:'학교별 세부 교육과정은 공식 확인 예정';
const dateStatus=(s)=>s.programs.some(p=>p.status==='CONFIRMED')||Object.keys(s.metrics).length>0;
const button=(label,action,klass='outline-btn btn-small',attrs='')=>`<button type="button" class="${klass}" data-action="${action}" ${attrs}>${label}</button>`;
const siteLink=(s,label='학교 홈페이지 ↗')=>s.url?`<a class="site-link" target="_blank" rel="noopener noreferrer" href="${safe(s.url)}" title="학교 공식 홈페이지 (인터넷 연결 필요)">${safe(label)}</a>`:`<a class="site-link unverified" target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=${encodeURIComponent('전북 '+s.name+' 공식 학교 홈페이지')}" title="해당 학교의 공식 주소가 아직 검증되지 않아 검색 페이지로 연결합니다">홈페이지 찾기 (주소 미확인) ↗</a>`;
const schoolInfoLink=()=>`<a class="site-link" href="https://www.schoolinfo.go.kr/ei/ss/pneiss_a03_s0.do" target="_blank" rel="noopener noreferrer">학교알리미에서 검색 ↗</a>`;
const vocational=s=>s.type==='SPECIALIZED'&&s.subtype==='직업'||s.type==='SPECIAL_PURPOSE'&&s.subtype==='마이스터고';

const commonFooter=()=>`<footer class="foot">본 사이트는 학교알리미 Open API에서 제공하는 공시정보를 활용합니다. 출처: 학교알리미 (교육부·한국교육학술정보원). <a href="https://www.schoolinfo.go.kr/" target="_blank" rel="noopener noreferrer">학교알리미 바로가기 ↗</a><br>© 전북 고교 인사이트 · 연구·상담 보조 자료 · 개별 학교 정보는 공식 발표와 달라질 수 있습니다.</footer>`;
function setView(view){state.view=view;state.detail=null;state.detailTab='overview';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.getElementById('aside').classList.remove('show');document.getElementById('menu-overlay').classList.remove('show');document.getElementById('nav-compare-count').textContent=state.compare.length?`${state.compare.length}/3`:'';render();window.scrollTo({top:0,behavior:'instant'});}
function filtered(){let q=state.query.toLowerCase().replace(/\s/g,'');let list=all.filter(s=>{
 if(state.regions.size&&!state.regions.has(s.region))return false;
 if(state.types.size&&!state.types.has(s.type)&&!(state.types.has('AUTONOMOUS_PUBLIC')&&autonomousHistory[s.name]))return false;
 if(state.founder==='AUTONOMOUS_PUBLIC'&&!autonomousHistory[s.name])return false; if(state.founder!=='ALL'&&state.founder!=='AUTONOMOUS_PUBLIC'&&s.founder!==state.founder)return false;
 if(state.gender!=='ALL'&&s.gender!==state.gender)return false;
 if(state.boarding!=='ALL'&&s.boarding!==state.boarding)return false;
 if(state.phase!=='ALL'&&s.phase!==state.phase)return false;
 if(q&&!([s.name,s.region,s.guide,s.subtype,s.address,...s.aliases,...s.programs.map(p=>p.name),...s.programs.map(p=>p.area)].join(' ').toLowerCase().replace(/\s/g,'').includes(q)))return false;
 return true});
 return list.sort((a,b)=>state.sort==='name_desc'?b.name.localeCompare(a.name,'ko'):state.sort==='region'?a.region.localeCompare(b.region,'ko')||a.name.localeCompare(b.name,'ko'):state.sort==='type'?typeMap[a.type].localeCompare(typeMap[b.type],'ko')||a.name.localeCompare(b.name,'ko'):a.name.localeCompare(b.name,'ko'));
}
function kpi(label,value,note,cls=''){return `<div class="kpi"><div class="kpi-head">${label}<i class="kpi-dot ${cls}"></i></div><div class="kpi-value">${value}</div><div class="kpi-note">${note}</div></div>`}
function chart(rows,max,clickRegion=false){return rows.map(([name,n])=>`<div class="bar-row ${clickRegion?'region-click':''}" ${clickRegion?`data-region-chart="${safe(name)}" role="button" tabindex="0" aria-label="${safe(name)} 학교 목록 보기" title="해당 지역 학교 보기"`:''}><div class="bar-label">${safe(name)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/max*100)}%"></div></div><div class="bar-val">${fmt(n)}</div></div>`).join('')}
function dashboard(){const c=(fn)=>all.filter(fn).length;const regionRows=regions.map(x=>[x,c(s=>s.region===x)]);const max=Math.max(...regionRows.map(x=>x[1]));const typeRows=Object.keys(typeMap).filter(t=>t!=='UNKNOWN').map(t=>[typeMap[t],c(s=>s.type===t)]);const verified=all.filter(dateStatus);return `
<section class="hero"><div class="hero-content"><div class="hero-kicker">EXPLORE YOUR FUTURE</div><h1>전북의 모든 고등학교,<br>한곳에서 찾고 비교하세요.</h1><p>14개 시·군의 고등학교 정보를 정리했습니다. 진로·입학·학교생활 자료의 출처를 확인하면서 나에게 맞는 학교를 탐색하세요.</p><div class="hero-actions">${button('전체 고등학교 탐색 →','go-schools','primary-btn')}${button('진로·학과 살펴보기','go-career','outline-btn')}</div></div><div class="hero-graphic" aria-hidden="true">▤</div></section>
<div class="kpi-grid">${kpi('수록된 고등학교',fmt(all.length)+'<span style="font-size:14px">개교</span>','고입 안내 재구성','')}${kpi('전북 시·군',fmt(regions.length)+'<span style="font-size:14px">곳</span>','전 지역 검색 지원','green')}${kpi('학교 분류',fmt(typeRows.filter(x=>x[1]>0).length)+'<span style="font-size:14px">유형</span>','법정 유형 기준','purple')}${kpi('세부자료 일부 확인',fmt(verified.length)+'<span style="font-size:14px">개교</span>','학교별 공시·학과 일부 수록','orange')}</div>
<div class="panels"><section class="panel"><h2 class="panel-title">시·군별 고등학교 현황</h2><p class="panel-sub">학교 수 · 막대를 누르면 해당 지역 검색으로 이동합니다.</p>${chart(regionRows,max,true)}<p class="chart-note">지역별 수치는 이 프로그램에 수록된 학교의 분포이며, 각 학교의 공식 기준일·학교코드 대조는 계속 필요합니다.</p></section><section class="panel"><h2 class="panel-title">학교 유형별 현황</h2><p class="panel-sub">수록된 명부의 유형 분류 기준</p>${chart(typeRows,Math.max(...typeRows.map(x=>x[1])))}<div class="tip">특목고에는 산업수요맞춤형고(마이스터고)가 포함됩니다. 자율형 공립고의 최신 지정 현황은 세부 대조 전이므로 일부 일반고 그룹에 포함되어 있습니다.</div><h3 style="margin:25px 0 7px">상담 시 꼭 확인하세요</h3><p class="subtitle">입학 가능 여부와 모집인원은 최신 학교별 전형요강을 우선 확인해야 합니다. 학교 특징을 점수화하거나 합격 가능성을 임의로 예측하지 않습니다.</p>${button('자료 검증 기준 보기 →','go-sources','ghost-btn btn-small','style="margin-top:13px"')}</section></div>
<div class="tip warn"><b>자료 범위 안내</b> · 학교알리미 기본정보와 대조한 132개교를 수록하며 휴교 1개교가 포함됩니다. 폐교로 확인된 무풍고는 제외했습니다. 학교 유형·입학·진학·취업 등 세부 정보는 아직 전수 검증되지 않았습니다.</div>${commonFooter()}`;}
function filters(){let regionsHtml=`${button('전체 지역','reset-regions','chip '+(!state.regions.size?'selected':''),'aria-pressed="'+(!state.regions.size)+'"')}${regions.map(r=>`<button type="button" class="chip ${state.regions.has(r)?'selected':''}" aria-pressed="${state.regions.has(r)}" data-toggle-region="${safe(r)}">${safe(r)}</button>`).join('')}`;let typeHtml=button('전체 유형','reset-types','chip '+(!state.types.size?'selected':''))+Object.keys(typeMap).filter(x=>x!=='UNKNOWN').map(x=>`<button type="button" class="chip ${state.types.has(x)?'selected':''}" data-toggle-type="${x}" aria-pressed="${state.types.has(x)}">${typeMap[x]}</button>`).join('')+`<button type="button" class="chip ${state.types.has('AUTONOMOUS_PUBLIC')?'selected':''}" data-toggle-type="AUTONOMOUS_PUBLIC" aria-pressed="${state.types.has('AUTONOMOUS_PUBLIC')}">자율형 공립고 지정 이력</button>`;
return `<div class="filters"><div class="filters-row"><div><label class="form-label" for="school-search">학교명 · 학과 · 관심 분야 검색</label><input class="field" id="school-search" type="search" placeholder="예: 전주, 반려동물, 국악" value="${safe(state.query)}"></div><div><label class="form-label" for="founder-filter">설립 구분</label><select id="founder-filter" class="field"><option value="ALL">전체 설립 구분</option>${Object.keys(foundMap).map(k=>`<option value="${k}" ${state.founder===k?'selected':''}>${foundMap[k]}</option>`).join('')}<option value="AUTONOMOUS_PUBLIC" ${state.founder==='AUTONOMOUS_PUBLIC'?'selected':''}>자율형 공립고 지정 이력</option></select></div><div><label class="form-label" for="phase-filter">전·후기 전형</label><select id="phase-filter" class="field"><option value="ALL">전체 전형 시기</option><option value="EARLY" ${state.phase==='EARLY'?'selected':''}>전기</option><option value="LATE" ${state.phase==='LATE'?'selected':''}>후기</option></select></div><div><label class="form-label" for="sort-filter">정렬 기준</label><select id="sort-filter" class="field"><option value="name" ${state.sort==='name'?'selected':''}>학교명 가나다순</option><option value="name_desc" ${state.sort==='name_desc'?'selected':''}>학교명 역순</option><option value="region" ${state.sort==='region'?'selected':''}>지역순</option><option value="type" ${state.sort==='type'?'selected':''}>학교 유형순</option></select></div></div><div class="filter-line"><b>지역</b><div class="chipbar">${regionsHtml}</div></div><div class="filter-line"><b>학교 유형</b><div class="chipbar">${typeHtml}</div></div><div class="filter-line"><b>추가 조건</b><div style="display:flex;gap:8px;flex-wrap:wrap"><label class="form-label" style="margin:0"><span style="display:none">성별구성</span><select class="field" id="gender-filter" aria-label="남녀공학 여부" style="height:36px"><option value="ALL">남녀 구분 전체</option>${Object.keys(genderMap).map(k=>`<option value="${k}" ${state.gender===k?'selected':''}>${genderMap[k]}</option>`).join('')}</select></label><label class="form-label" style="margin:0"><span style="display:none">기숙사</span><select class="field" id="boarding-filter" aria-label="기숙사 운영 여부" style="height:36px"><option value="ALL">기숙사 전체</option>${Object.keys(boardMap).map(k=>`<option value="${k}" ${state.boarding===k?'selected':''}>${boardMap[k]}</option>`).join('')}</select></label>${button('조건 초기화 ↻','reset-all','outline-btn btn-small')}</div></div></div>`;
}
function card(s){let included=state.compare.includes(s.id),fav=state.favorites.has(s.id);let style=s.type==='SPECIALIZED'?'green':s.type==='SPECIAL_PURPOSE'?'purple':s.type==='AUTONOMOUS'?'orange':'blue';return `<article class="school-card"><div class="card-top">${tag(typeMap[s.type],style)}${tag(s.region)}${s.operational_status==='PAUSED'?tag('휴교','orange'):''}</div><h3>${safe(s.name)} ${autonomousLabel(s)}</h3><div class="school-meta">${s.operational_status==='PAUSED'?'휴교 · 모집 여부 확인 필요':`${safe(s.guide)} <span>·</span> ${safe(phaseMap[s.phase])} 전형`}</div><div class="school-extra">${safe(summary(s))}</div><div class="card-actions"><button type="button" class="outline-btn btn-small" data-open="${safe(s.id)}">상세보기 →</button>${siteLink(s,'홈페이지 ↗')}<button type="button" class="circle-btn ${included?'active':''}" title="${included?'비교에서 제외':'비교에 추가'}" aria-label="${safe(s.name)} ${included?'비교 제외':'비교 추가'}" data-compare="${safe(s.id)}">⇔</button><button type="button" class="circle-btn ${fav?'active':''}" title="${fav?'관심학교 해제':'관심학교 등록'}" aria-label="${safe(s.name)} 관심학교" data-favorite="${safe(s.id)}">${fav?'★':'☆'}</button></div></article>`}
function schoolPage(){let ls=filtered(),pages=Math.max(1,Math.ceil(ls.length/state.perPage));state.page=Math.min(state.page,pages);let paged=ls.slice((state.page-1)*state.perPage,state.page*state.perPage);return `<div class="page-head"><div><div class="eyebrow">SCHOOL DIRECTORY</div><h1>전체 고등학교 찾기</h1><p class="subtitle">지역과 유형을 여러 개 선택하고, 학교명·학과·관심 분야를 검색할 수 있습니다.</p></div><div class="result-actions">${button('현재 결과 CSV 저장','export-csv','outline-btn btn-small')}</div></div>${filters()}<div id="school-results"><div class="result-head"><div><b>검색 결과 <span class="count-accent">${fmt(ls.length)}</span>개교</b><p class="subtitle">전체 ${all.length}개교 중 표시 · 18개씩 보기 · 세부 자료는 학교마다 다릅니다.</p></div><div class="result-actions">${button('비교함 '+state.compare.length+'/3 →','go-compare','ghost-btn btn-small')}</div></div><section class="school-grid">${paged.length?paged.map(card).join(''):`<div class="empty"><strong>검색 결과가 없습니다.</strong>다른 검색어 또는 필터를 선택해 보세요.<div style="margin-top:12px">${button('전체 조건 지우기','reset-all','primary-btn btn-small')}</div></div>`}</section>${pages>1?`<div class="pagination" aria-label="페이지 선택">${button('이전','page-prev','btn-small')}${Array.from({length:pages},(_,i)=>`<button type="button" class="${state.page===i+1?'active':''}" data-page="${i+1}" aria-label="${i+1}페이지">${i+1}</button>`).join('')}${button('다음','page-next','btn-small')}</div>`:''}<p class="bottom-note">학교별 학과·공시정보 확인 범위는 각 카드의 상세 화면에서 확인할 수 있습니다. 미검증 항목을 빈 값이나 0으로 취급하지 않습니다.</p>${commonFooter()}</div>`;}
function refreshSearchResults(){const old=document.getElementById('school-results');if(!old)return;const scratch=document.createElement('div');scratch.innerHTML=schoolPage();const newest=scratch.querySelector('#school-results');if(newest)old.replaceWith(newest);}
function info(label,value){return `<div class="info-item"><dt>${safe(label)}</dt><dd>${value??missing()}</dd></div>`;}
function sourceList(ids){let list=[...new Set(ids)].map(source).filter(Boolean);return `<div class="source-list">${list.map(s=>`<div class="source-item"><div><strong>${safe(s.name)}</strong><p>${safe(s.purpose)}<br>기준·확인일: ${safe(s.date)}</p></div><a href="${safe(s.url)}" target="_blank" rel="noopener noreferrer" title="인터넷 연결 시 원문 열기">원문 ↗</a></div>`).join('')}</div>`;}
function metricCell(s,code){const m=s.metrics[code];return m?`<b>${fmt(m.value)} ${safe(m.unit)}</b>`:missing()}
function genderChart(s){const g=s.studentSex;if(!g||g.male+g.female===0)return '<div class="sex-missing">성별 학생 수 미확인</div>';const n=g.male+g.female,p=Math.round(g.male/n*1000)/10,q=Math.round((100-p)*10)/10;return `<div class="sex-chart" aria-label="남학생 ${fmt(g.male)}명 ${p}%, 여학생 ${fmt(g.female)}명 ${q}%"><div class="sex-bar"><span style="width:${p}%"></span><i style="width:${q}%"></i></div><div class="sex-label"><span>남학생 ${fmt(g.male)}명 (${p}%)</span><span>여학생 ${fmt(g.female)}명 (${q}%)</span></div><small>${safe(g.year)}년 공시 기준</small></div>`}
const autonomousHistory={'양현고등학교':2024,'전주고등학교':2024,'전주솔내고등학교':2024,'전주여자고등학교':2024,'진안제일고등학교':2024,'남원고등학교':2025,'이리여자고등학교':2025};
function autonomousLabel(s){return autonomousHistory[s.name]?`<span class="tag blue">자율형 공립고 지정 이력 · ${autonomousHistory[s.name]}년 확인</span>`:''}
function bars(items,unit){const valid=items.filter(x=>typeof x[1]==='number'&&Number.isFinite(x[1])&&x[1]>=0),max=Math.max(1,...valid.map(x=>x[1]));return items.map(([label,value])=>{if(typeof value!=='number'||!Number.isFinite(value)||value<0)return `<div class="metric-bar-row"><span>${safe(label)}</span><span>정보 미확인</span></div>`;return `<div class="metric-bar-row"><span>${safe(label)}</span><div class="bar-track"><div class="bar-fill" style="width:${value/max*100}%"></div></div><b>${fmt(value)}${unit}</b></div>`}).join('')}
function featurePage(s){const p=s.specialPrograms;const link=s.schoolinfo_uuid?'https://www.schoolinfo.go.kr/ei/ss/Pneiss_b01_s0.do?SHL_IDF_CD='+encodeURIComponent(s.schoolinfo_uuid):'https://www.schoolinfo.go.kr/ei/ss/pneiss_a03_s0.do';const status=v=>v==='YES'?'지정·운영':v==='NO'?'해당 없음':'정보 미확인';return `<h3 style="margin:17px 0 12px">교육운영 특색사업 계획</h3>${p?`<div class="info-grid">${info('교과교실제',status(p.classroom))}${info('자율학교',status(p.autonomousSchool))}${info('수준별 수업',status(p.levelBased))}</div><p class="bottom-note">${safe(p.year)}년 공시 · 자율학교는 자율형 공립고와 별개의 구분입니다.</p>`:'<div class="notice-card">학교알리미에서 공시정보를 확인하지 못했습니다.</div>'}<div class="tip"><b>학교별 특색사업 계획 파일 확인</b><br>학교알리미에서 <b>교육활동 → 교육운영 특색사업 계획</b>을 선택한 뒤, 아래쪽 <b>기타 교육운영 특색사업</b>에서 공시년월과 첨부파일을 확인하세요. 파일 다운로드와 미리보기는 학교알리미에서 이용할 수 있습니다.</div><div class="resource-actions"><a class="site-link" href="${safe(link)}" target="_blank" rel="noopener noreferrer">학교알리미 공시 화면 열기 ↗</a></div>`}
function clubsPage(s){const c=s.clubs,a=s.afterSchool;return `<h3 style="margin:17px 0 10px">동아리 활동 현황</h3>${c?`<div class="notice-card">${bars([['창의적 체험활동 동아리',c.curricular],['학생 자율동아리',c.studentLed]],'개')}<small>${safe(c.year)}년 공시</small></div>`:'<div class="notice-card">동아리 정보 미확인</div>'}<h3 style="margin:24px 0 10px">방과후학교 운영 현황</h3>${a?`<div class="notice-card"><b>프로그램 수</b>${bars([['교과',a.currPrograms],['특기적성',a.aptitudePrograms]],'개')}<b>수강 등록 건수</b>${bars([['교과',a.currEnrollments],['특기적성',a.aptitudeEnrollments]],'건')}<small>${safe(a.year)}년 공시 · 등록 건수는 학생 실인원과 다를 수 있습니다.</small></div>`:'<div class="notice-card">방과후학교 정보 미확인</div>'}`}
function libraryPage(s){const l=s.library;return `<h3 style="margin:17px 0 10px">도서관 이용 현황 (1인당)</h3>${l?`<div class="notice-card">${bars([['장서수',l.stockPerStudent],['대출자료수',l.loansPerStudent]],'')}<small>${safe(l.year)}년 공시 · 장서수는 학생 1인당 도서관 보유 자료 수(권), 대출자료수는 학생 1인당 대출 자료 수(건)입니다. 항목별 기준 학생 수와 집계 기간은 서로 다를 수 있습니다.</small></div>`:'<div class="notice-card">도서관 정보 미확인</div>'}`}
function detailContent(s){const tab=state.detailTab;const admitted=s.admission;const prog=s.programs;const intro=`<div class="status-note">${safe(s.status)} · 학교별 전형 세부 사항 및 입학 자격은 반드시 해당 학교 공식 요강으로 재확인하세요.</div>`;
if(tab==='overview')return `${intro}<h3 style="margin:14px 0 12px">학교 기본정보</h3><div class="info-grid">${info('학교명',safe(s.name))}${autonomousHistory[s.name]?info('자율형 공립고',autonomousHistory[s.name]+'년 지정·운영 확인 (현행 여부 확인 필요)'):''}${info('지역',safe(s.region))}${info('학교 유형',safe(typeMap[s.type]))}${info('설립 구분',s.founder==='UNKNOWN'?null:safe(foundMap[s.founder]))}${info('남녀공학 여부',s.gender==='UNKNOWN'?null:safe(genderMap[s.gender]))}${info('학교 주소',s.address?safe(s.address):null)}</div>`;
if(tab==='features')return featurePage(s);
if(tab==='clubs')return clubsPage(s);
if(tab==='library')return libraryPage(s);
if(tab==='academic'){const link=s.schoolinfo_uuid?'https://www.schoolinfo.go.kr/ei/ss/Pneiss_b01_s0.do?SHL_IDF_CD='+encodeURIComponent(s.schoolinfo_uuid):'https://www.schoolinfo.go.kr/ei/ss/pneiss_a03_s0.do';return `${intro}<h3 style="margin:16px 0 10px">학교교육과정 편성 · 운영 및 평가</h3><div class="notice-card">학교알리미의 학교별 공시 화면에서 교육활동 → 학교교육과정 편성 · 운영 및 평가 항목을 선택하면 공시년월과 파일 목록, 다운로드 및 미리보기를 확인할 수 있습니다.</div><div class="resource-actions"><a class="site-link" target="_blank" rel="noopener noreferrer" href="${safe(link)}">학교알리미 공시 화면 열기 ↗</a></div>`}
if(tab==='departments'){
const general=s.type==='GENERAL'||s.type==='AUTONOMOUS';
const links=`<div class="resource-actions">${siteLink(s,'교육과정 · 학교 홈페이지 ↗')}${schoolInfoLink()}</div>`;
if(general&&!prog.length)return `${intro}<h3 style="margin:16px 0 10px">교육과정 원문 확인</h3><div class="notice-card">일반고의 교과 선택과목·학교별 교육과정은 연도에 따라 변경됩니다. 임의로 목록을 생성하지 않고 학교알리미와 학교 홈페이지 원문 링크를 제공합니다.</div>${links}`;
const confirmed=prog.filter(p=>p.status==='CONFIRMED');const archival=prog.filter(p=>p.status!=='CONFIRMED');
const programCard=(p,planned=false)=>`<article class="voc-program ${planned||p.status!=='CONFIRMED'?'muted':''}"><h4>${safe(p.name)}</h4><p>${p.description?safe(p.description):'학과명은 확인됐으나 세부 교육 내용은 공식 원문 확인이 필요합니다.'}</p><div>${tag(p.area||'학과', 'blue')} ${tag(p.year+'학년도')} ${tag(planned?'개편 예정 · 승인 여부 확인':p.status==='CONFIRMED'?'학과명 확인':'구자료 · 재확인',planned?'orange':p.status==='CONFIRMED'?'green':'orange')}</div><small class="mini-label">${p.description?'학습 내용 설명은 전공 분야를 쉽게 이해하기 위한 요약이며 학교별 실제 교육과정과 다를 수 있습니다.':''} 자료: ${safe(source(p.source)?.name||'원문 근거 미확인')}</small></article>`;
return `${intro}<h3 style="margin:16px 0 10px">${vocational(s)?'학과 및 전공별 학습 내용':'학과·교육과정 정보'}</h3>${general?'<div class="notice-card">일반고의 최신 선택과목 및 교육과정 상세는 아래 공식 페이지를 우선 확인하세요.</div>':''}${links}${confirmed.length?confirmed.map(p=>programCard(p)).join(''):'<div class="notice-card">현재 운영 학과에 대한 개별 공식 자료가 부족합니다. 특정 학과가 없는 학교라는 뜻은 아닙니다.</div>'}${archival.length?`<h3 style="margin:22px 0 10px">과거 확인 자료 (현행 여부 미확인)</h3>${archival.map(p=>programCard(p)).join('')}`:''}${s.planned_programs.length?`<h3 style="margin:22px 0 10px">학과 개편 예정</h3><div class="notice-card">개편 예정·검토 정보입니다. 현재 운영 중인 학과로 간주하지 마세요. 확정 사항은 학교의 최신 모집요강을 확인해야 합니다.</div>${s.planned_programs.map(p=>programCard(p,true)).join('')}`:''}`;
}
if(tab==='special'){
const cats=[['APPRENTICE','산학일체형 도제학교'],['SME','중소기업 특성화고 인력양성사업'],['MILITARY','군특성화고'],['CREDIT','고교학점제 선도학교'],['OTHER','기타 사업·특화 프로그램']];
const verified=(s.government_programs||[]).filter(g=>g.status==='CONFIRMED');
const checks=cats.map(([code,label])=>{const hits=verified.filter(g=>g.category===code);return `<label class="program-check"><input type="checkbox" ${hits.length?'checked':''} disabled aria-label="${safe(label)} 확인 여부"><span><strong>${label}</strong><small>${hits.length?'공식 자료에서 참여 확인':'참여 여부 미확인 (미참여 의미 아님)'}</small></span></label>`;}).join('');
const groups=Object.groupBy?Object.groupBy(s.qualifications||[],q=>q.department||'공통'):Object.fromEntries([...new Set((s.qualifications||[]).map(q=>q.department||'공통'))].map(dept=>[dept,(s.qualifications||[]).filter(q=>(q.department||'공통')===dept)]));
return `${intro}<h3 style="margin:16px 0 8px">주요 정부 지원 사업 및 특화 프로그램</h3><div class="notice-card">체크 표시는 공식 자료에서 확인된 사업만 의미합니다. 체크되지 않은 항목은 <b>미참여가 아니라 미확인</b>입니다. 학교별 운영연도와 사업 지정현황은 변동될 수 있습니다.</div><div class="program-check-grid">${checks}</div>${verified.length?verified.map(g=>`<div class="qual-dept"><strong>${safe(g.name)}</strong> ${tag(g.year+'년','green')}<p style="font-size:12px;color:#61768b;margin-top:7px">${safe(g.note||'공식 자료 확인')} · ${safe(source(g.source)?.name||'근거 미확인')}</p></div>`).join(''):'<div class="notice-card">검증된 학교별 사업 참여 명세가 아직 없습니다.</div>'}<h3 style="margin:25px 0 10px">전공 관련 주요 취득 목표 자격증</h3><div class="notice-card">자격증은 학교가 전공과 관련해 안내한 <b>취득 가능·목표 자격</b>이며 졸업생의 실제 취득이나 개인별 취득 보장을 뜻하지 않습니다.</div>${Object.keys(groups).length?Object.entries(groups).map(([dept,qs])=>`<div class="qual-dept"><h4>${safe(dept)}</h4><div class="qual-list">${qs.map(q=>`<span>${safe(q.name)}</span>`).join('')}</div><p style="font-size:12px;color:#61768b;margin-top:9px">근거: ${safe(source(qs[0].source)?.name||'학교 공식 학과소개')} · ${qs[0].year}년 확인</p></div>`).join(''):'<div class="notice-card">학교별 자격증 목록은 아직 공식 확인자료를 확보하지 못했습니다. 학과소개 또는 학교 홈페이지에서 확인해 주세요.</div>'}<div class="resource-actions">${siteLink(s,'학교 학과소개 확인 ↗')}${schoolInfoLink()}</div>`;
}
if(tab==='admission')return `${intro}<div class="info-grid">${info('자료 학년도',admitted.year?admitted.year+'학년도':null)}${info('전형 시기',safe(phaseMap[s.phase]))}${info('전형 안내 분류',safe(s.guide))}${info('평준화 적용',admitted.equalization==='APPLIES'?'적용(안내 명부 기준)':admitted.equalization==='NOT_APPLICABLE'?'비적용(안내 명부 기준)':null)}${info('선발 주체',admitted.selection==='SUPERINTENDENT'?'교육감 전형(안내 명부 기준)':null)}${info('학교별 모집 정원',admitted.quota===null?null:fmt(admitted.quota)+'명')}</div>${admitted.details?`<div class="tip">${safe(admitted.details)}</div>`:''}<div class="tip warn">학교별 모집 정원·지원 자격·학과별 전형은 일부만 확인됐습니다. 교육청 기본계획은 학교별 모집요강을 대신하지 않으며, 최신 모집요강 확인이 필요합니다.</div>`;
if(tab==='metrics')return `${intro}<h3 style="margin:17px 0 12px">공시 및 학교 현황 지표</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>지표</th><th>값</th></tr></thead><tbody>${Object.keys(metricMap).map(k=>`<tr><td>${metricMap[k]}</td><td>${metricCell(s,k)}${k==='STUDENT_COUNT'?genderChart(s):''}</td></tr>`).join('')}</tbody></table></div><p class="bottom-note">학급당 학생 수는 전체 학생 수를 전체 학급 수로 나눈 값입니다. 연도 및 산식이 다른 지표를 순위화하지 않습니다.</p>`;
return `${intro}<div class="resource-actions">${siteLink(s)}${schoolInfoLink()}</div><h3 style="margin:15px 0 12px">이 학교의 자료 근거</h3>${sourceList([...s.source_ids,...s.programs.map(p=>p.source),...s.planned_programs.map(p=>p.source),...s.government_programs.map(g=>g.source),...s.qualifications.map(q=>q.source),...Object.values(s.metrics).map(m=>m.source)])}<p class="bottom-note">외부 원문은 인터넷 연결 시에만 볼 수 있습니다. 미확인 항목은 사실로 간주하지 않습니다.</p>`;}
function detailPage(s){let labels=[['overview','기본정보'],...((s.type==='SPECIALIZED'||vocational(s))?[['departments','학과정보']]:[]),['academic','교육과정'],['features','특색사업'],...(vocational(s)?[['special','특화 교육·자격증']]:[]),['admission','입학정보'],['metrics','공시지표'],['clubs','동아리&방과후'],['library','도서관현황']];return `<div class="page-head"><div><div class="eyebrow">SCHOOL PROFILE</div><h1>학교 상세정보</h1><p class="subtitle">확인한 사실과 미확인된 항목을 분리해 표시합니다.</p></div>${button('← 전체 목록으로','go-schools','outline-btn btn-small')}</div><article class="details-sheet"><div class="detail-head"><div><div class="detail-mini">${tag(s.region)}${tag(typeMap[s.type],'blue')} ${tag(phaseMap[s.phase]+' 전형')}</div><h2 class="detail-name">${safe(s.name)} ${autonomousLabel(s)}</h2><p class="subtitle">${safe(s.guide)} · 데이터 검토 2026.11.08</p><div class="resource-actions">${siteLink(s)}</div></div><div class="result-actions">${button(state.compare.includes(s.id)?'비교에서 제외':'학교 비교에 추가','detail-compare','ghost-btn btn-small')}${button('인쇄 / PDF','print-detail','outline-btn btn-small')}</div></div><div class="detail-tabs" role="tablist" aria-label="학교 상세 탭">${labels.map(([k,v])=>`<button type="button" role="tab" aria-selected="${state.detailTab===k}" class="detail-tab ${state.detailTab===k?'active':''}" data-detailtab="${k}">${v}</button>`).join('')}</div><div class="detail-section" role="tabpanel">${detailContent(s)}</div></article>${commonFooter()}`;}
function careerPage(){const areas=[...new Set(all.flatMap(s=>s.programs.filter(p=>p.status==='CONFIRMED').map(p=>p.area)))].sort((a,b)=>a.localeCompare(b,'ko'));let matches=all.flatMap(s=>s.programs.filter(p=>p.status==='CONFIRMED'&&(state.career==='ALL'||p.area===state.career)).map(p=>({s,p})));return `<div class="page-head"><div><div class="eyebrow">CAREER EXPLORER</div><h1>진로·학과 탐색</h1><p class="subtitle">공식 학과 자료가 확인된 학교만 연결하며, 이름만 보고 임의 추천하지 않습니다.</p></div></div><div class="panel"><h2 class="panel-title">관심 진로 분야 선택</h2><p class="panel-sub">연도·학과명·자료 출처를 함께 확인할 수 있습니다.</p><div class="career-choices"><button class="chip ${state.career==='ALL'?'selected':''}" data-career="ALL">전체 분야</button>${areas.map(a=>`<button class="chip ${state.career===a?'selected':''}" data-career="${safe(a)}">${safe(a)}</button>`).join('')}</div><div class="tip warn">진로 탐색은 현재 확인된 교육과정 일부를 기반으로 합니다. 검색 결과가 적어도 해당 분야를 운영하는 학교가 전북에 없다는 의미는 아닙니다. 구자료(2025학년도)는 후보 추천에서 제외됩니다.</div></div><div class="result-head"><div><b>관련 학과 <span class="count-accent">${matches.length}</span>건</b><p class="subtitle">출처를 확인한 학과만 표시</p></div></div>${matches.length?matches.map(({s,p})=>`<article class="match-result"><div class="card-top"><strong>${safe(s.name)}</strong>${tag(s.region)}</div><p>${tag(p.area,'green')} <b style="font-size:12px">${safe(p.name)}</b> · ${p.year}학년도 자료</p><div class="school-meta">확인 근거: ${safe(source(p.source)?.name||'공식 자료')}</div><div style="margin-top:12px">${button('학교 상세보기 →','open-any','outline-btn btn-small',`data-target="${safe(s.id)}"`)}</div></article>`).join(''):`<div class="empty"><strong>선택한 분야의 검증된 학과 자료가 없습니다.</strong>학과 목록은 추후 공식 확인자료에 따라 확장됩니다.</div>`}${commonFooter()}`;}
function comparePage(){let sels=state.compare.map(schoolById).filter(Boolean);let cols=sels.map((s,i)=>`<div class="slot filled"><div><span class="tag blue">학교 ${i+1}</span><p style="font-size:15px;font-weight:800;margin:8px 0 4px">${safe(s.name)}</p><small style="color:#64849c">${safe(s.region)} · ${safe(typeMap[s.type])}</small></div><button class="circle-btn" aria-label="비교에서 제거" data-compare="${safe(s.id)}">×</button></div>`);while(cols.length<3)cols.push(`<div class="slot"><div class="slot-placeholder">+ 비교 학교를 선택하세요.<br><small>전체 학교 찾기에서 추가</small></div></div>`);function row(label,fn){return `<tr><th scope="row">${label}</th>${sels.map(s=>`<td>${fn(s)}</td>`).join('')}</tr>`;}return `<div class="page-head"><div><div class="eyebrow">SCHOOL COMPARISON</div><h1>학교 비교 분석</h1><p class="subtitle">최대 3개교를 같은 기준으로 나란히 비교합니다.</p></div><div class="result-actions">${button('학교 추가하기','go-schools','outline-btn btn-small')}${button('비교표 인쇄 / PDF','print-compare','primary-btn btn-small',sels.length?'':'disabled')}</div></div><div class="compare-slots">${cols.join('')}</div>${sels.length?`<div class="table-wrap"><table class="data-table compare-table"><thead><tr><th scope="col">비교 항목</th>${sels.map(s=>`<th scope="col">${safe(s.name)}</th>`).join('')}</tr></thead><tbody>${row('지역',s=>safe(s.region))}${row('학교 유형',s=>safe(typeMap[s.type]))}${row('전형 분류',s=>safe(s.guide))}${row('전형 시기',s=>safe(phaseMap[s.phase]))}${row('설립 구분',s=>s.founder==='UNKNOWN'?missing():safe(foundMap[s.founder]))}${row('남녀공학',s=>s.gender==='UNKNOWN'?missing():safe(genderMap[s.gender]))}${row('기숙사',s=>s.boarding==='UNKNOWN'?missing():safe(boardMap[s.boarding]))}${row('확인된 학과',s=>s.programs.length?s.programs.map(p=>`${safe(p.name)} <small>(${p.year}년${p.status!=='CONFIRMED'?', 구자료':''})</small>`).join('<br>'):missing())}${row('학생 수',s=>metricCell(s,'STUDENT_COUNT'))}${row('학급 수',s=>metricCell(s,'CLASS_COUNT'))}${row('모집 정원',s=>s.admission.quota===null?missing():fmt(s.admission.quota)+'명')}</tbody></table></div><div class="tip warn">비교된 학교 중 일부는 교육과정·공시 정보가 미수록 상태입니다. 서로 다른 기준연도의 수치를 동일한 연도로 간주하거나 학교별 우열을 판단하지 마세요.</div>`:`<div class="empty"><strong>비교할 학교를 아직 선택하지 않았습니다.</strong>전체 학교 찾기에서 학교별 ⇔ 버튼을 눌러 최대 3곳을 추가할 수 있습니다.<div style="margin-top:12px">${button('학교 찾아보기 →','go-schools','primary-btn btn-small')}</div></div>`}${commonFooter()}`;}
function sourcePage(){const counts=Object.entries(typeMap).filter(([k])=>k!=='UNKNOWN').map(([k,v])=>[v,all.filter(s=>s.type===k).length]);const status=`학교별 공식 홈페이지 주소 ${all.filter(s=>Boolean(s.url)).length}/${all.length} · 학교 주소 ${all.filter(s=>Boolean(s.address)).length}/${all.length} · 확인된 학과 ${all.filter(s=>s.programs.some(p=>p.status==='CONFIRMED')).length}개교 · 자격증 목록 ${all.filter(s=>s.qualifications.length).length}개교 · 공시 지표 ${all.filter(s=>Object.keys(s.metrics).length).length}개교`;return `<div class="page-head"><div><div class="eyebrow">TRANSPARENCY & SOURCES</div><h1>데이터 및 출처 안내</h1><p class="subtitle">이 프로그램이 어디까지 확인했는지 투명하게 보여줍니다.</p></div></div><div class="panel"><h2 class="panel-title">데이터 범위와 검증 상태</h2><div class="tip warn"><b>전수 검증 미완료</b><br>학교알리미 기본정보에 맞춰 학교명·지역을 대조하고 학교알리미 코드를 연결했습니다. 휴교 1개교를 포함하며 폐교로 확인된 무풍고는 제외합니다. NEIS 코드·설립·남녀공학·학과·자격증·공시 지표는 모두 검증된 상태가 아닙니다. 학교별 홈페이지 주소는 공식 링크를 확인한 학교에만 직접 연결했고 나머지는 검색 안내를 표시합니다.</div><div class="info-grid">${info('수록 학교 수',fmt(all.length)+'개교')}${info('학교 수 공식 비교 기준','2026년 4월 1일')}${info('입학정보 기준','학교별 자료 확인 필요')}${info('학교별 심층자료',safe(status))}${info('데이터 구축일',safe(DB.manifest.built_on))}</div><h3 style="margin:22px 0 11px">학교 분류별 포함 현황</h3>${counts.map(([name,n])=>`<div class="category-line"><b>${name}</b><div class="progress"><i style="width:${n/all.length*100}%"></i></div><b>${n}개교</b></div>`).join('')}<p class="bottom-note">자율형 공립고 개별 지정은 일부 일반고에 포함되어 있어 후속 검증이 필요합니다.</p></div><section class="panel" style="margin-top:16px"><h2 class="panel-title">참고한 공식 출처와 개별 원문</h2><p class="panel-sub">원문 열기는 인터넷 연결 시에만 가능합니다. 홈페이지 내용을 앱이 실시간으로 갱신하지는 않습니다.</p>${sourceList(DB.sources.map(x=>x.id))}</section><div class="tip">결측상태 기준: <b>정보 미확인</b>은 0이나 해당 없음이 아닙니다. <b>구자료</b>는 과거 정보의 존재가 확인됐지만 최신 운영 여부를 확인하지 못했다는 뜻입니다. 인쇄 및 CSV 내보내기 역시 이런 구분을 유지합니다.</div>${commonFooter()}`;}
function printCompare(){const sels=state.compare.map(schoolById).filter(Boolean);if(!sels.length)return;let rows=[['지역',s=>s.region],['학교 유형',s=>typeMap[s.type]],['전형 분류',s=>s.guide],['전형 시기',s=>phaseMap[s.phase]],['설립',s=>foundMap[s.founder]],['학과',s=>s.programs.map(p=>`${p.name}(${p.year})`).join(', ')||'정보 미확인'],['학생 수',s=>s.metrics.STUDENT_COUNT?`${s.metrics.STUDENT_COUNT.value}명 (${s.metrics.STUDENT_COUNT.year})`:'정보 미확인'],['학급 수',s=>s.metrics.CLASS_COUNT?`${s.metrics.CLASS_COUNT.value}학급 (${s.metrics.CLASS_COUNT.year})`:'정보 미확인']];document.getElementById('print-area').innerHTML=`<h1>전북 고교 인사이트 · 학교 비교표</h1><p>고입 안내 기준 · 출력일 ${new Date().toLocaleDateString('ko-KR')}</p><table><thead><tr><th>구분</th>${sels.map(s=>`<th>${safe(s.name)}</th>`).join('')}</tr></thead><tbody>${rows.map(([name,fn])=>`<tr><th>${name}</th>${sels.map(s=>`<td>${safe(fn(s))}</td>`).join('')}</tr>`).join('')}</tbody></table><p class="fine">학교별 세부 자료 및 공시 정보 전수 검증 전인 초안입니다. 최신 모집요강을 별도로 확인하세요.</p>`;window.print();}
function printDetail(s){document.getElementById('print-area').innerHTML=`<h1>${safe(s.name)} · 학교 정보</h1><p>전북 고교 인사이트 / 고입 안내 기준 / ${safe(DB.manifest.built_on)}</p><table><tbody>${[['지역',s.region],['학교 유형',typeMap[s.type]],['전형 분류',s.guide],['전형 시기',phaseMap[s.phase]],['설립',foundMap[s.founder]],['주소',s.address||'정보 미확인'],['학과',s.programs.map(p=>`${p.name}(${p.year})`).join(', ')||'정보 미확인'],['모집 정원',s.admission.quota===null?'정보 미확인':s.admission.quota+'명']].map(([k,v])=>`<tr><th>${safe(k)}</th><td>${safe(v)}</td></tr>`).join('')}</tbody></table><p class="fine">추가 검증이 필요한 자료를 포함하며 학교의 공식 모집요강을 대신하지 않습니다.</p>`;window.print();}
function exportCsv(){let list=filtered(),heads=['학교명','지역','법정유형','전형분류','전기후기','설립구분','남녀구분','기숙사','주소','기준년도','학과확인'];let lines=[heads,...list.map(s=>[s.name,s.region,typeMap[s.type],s.guide,phaseMap[s.phase],foundMap[s.founder],genderMap[s.gender],boardMap[s.boarding],s.address||'정보 미확인',2027,s.programs.map(p=>p.name+'('+p.year+')').join('; ')||'정보 미확인'])];let csv='\ufeff'+lines.map(row=>row.map(t=>'"'+String(t).replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'});let link=document.createElement('a');let url=URL.createObjectURL(blob);link.href=url;link.download='전북고교인사이트_검색결과_2026-11-08.csv';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function render(){document.getElementById('nav-compare-count').textContent=state.compare.length?`${state.compare.length}/3`:'';if(state.detail){let s=schoolById(state.detail);el.innerHTML=s?detailPage(s):schoolPage();return;}el.innerHTML=state.view==='dashboard'?dashboard():state.view==='schools'?schoolPage():state.view==='career'?careerPage():state.view==='compare'?comparePage():sourcePage();}
function openSchool(id){state.detail=id;state.detailTab='overview';render();window.scrollTo({top:0,behavior:'instant'});}
function toggleCompare(id){let i=state.compare.indexOf(id);if(i>=0)state.compare.splice(i,1);else{if(state.compare.length>=3){alert('학교 비교는 최대 3개교까지 선택할 수 있습니다. 기존 학교를 먼저 제외해 주세요.');return;}state.compare.push(id);}render();}
function clearAll(){state.regions.clear();state.types.clear();state.founder='ALL';state.gender='ALL';state.boarding='ALL';state.phase='ALL';state.sort='name';state.query='';state.page=1;render();}
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-view]');if(nav){setView(nav.dataset.view);return;}
 const region=e.target.closest('[data-toggle-region]');if(region){let r=region.dataset.toggleRegion;state.regions.has(r)?state.regions.delete(r):state.regions.add(r);state.page=1;render();return;}
 const typ=e.target.closest('[data-toggle-type]');if(typ){let t=typ.dataset.toggleType;state.types.has(t)?state.types.delete(t):state.types.add(t);state.page=1;render();return;}
 const regionBar=e.target.closest('[data-region-chart]');if(regionBar){clearAll();state.regions.add(regionBar.dataset.regionChart);setView('schools');return;}
 const school=e.target.closest('[data-open]');if(school){openSchool(school.dataset.open);return;}
 const cmp=e.target.closest('[data-compare]');if(cmp){toggleCompare(cmp.dataset.compare);return;}
 const fav=e.target.closest('[data-favorite]');if(fav){let id=fav.dataset.favorite;state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);render();return;}
 const tab=e.target.closest('[data-detailtab]');if(tab){state.detailTab=tab.dataset.detailtab;render();return;}
 const career=e.target.closest('[data-career]');if(career){state.career=career.dataset.career;render();return;}
 const page=e.target.closest('[data-page]');if(page){state.page=Number(page.dataset.page);render();window.scrollTo({top:0,behavior:'instant'});return;}
 const action=e.target.closest('[data-action]');if(!action)return;
 switch(action.dataset.action){case'go-schools':setView('schools');break;case'go-career':setView('career');break;case'go-sources':setView('sources');break;case'go-compare':setView('compare');break;case'reset-all':clearAll();break;case'reset-regions':state.regions.clear();state.page=1;render();break;case'reset-types':state.types.clear();state.page=1;render();break;case'export-csv':exportCsv();break;case'detail-compare':if(state.detail)toggleCompare(state.detail);break;case'print-compare':printCompare();break;case'print-detail':if(state.detail)printDetail(schoolById(state.detail));break;case'open-any':openSchool(action.dataset.target);break;case'page-prev':state.page=Math.max(1,state.page-1);render();break;case'page-next':state.page=Math.min(Math.ceil(filtered().length/state.perPage),state.page+1);render();break;default:break;}
});
let schoolComposing=false;
document.addEventListener('compositionstart',e=>{if(e.target.id==='school-search')schoolComposing=true;});
document.addEventListener('compositionend',e=>{if(e.target.id==='school-search'){schoolComposing=false;state.query=e.target.value;state.page=1;refreshSearchResults();}});
document.addEventListener('input',e=>{if(e.target.id==='school-search'&&!e.isComposing&&!schoolComposing){state.query=e.target.value;state.page=1;refreshSearchResults();}});
document.addEventListener('change',e=>{let id=e.target.id;const vals={'founder-filter':'founder','gender-filter':'gender','boarding-filter':'boarding','phase-filter':'phase','sort-filter':'sort'};if(vals[id]){state[vals[id]]=e.target.value;state.page=1;render();}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-region-chart]')){e.preventDefault();e.target.click();}});
document.getElementById('mobile-menu').addEventListener('click',()=>{document.getElementById('aside').classList.add('show');document.getElementById('menu-overlay').classList.add('show');});
document.getElementById('menu-overlay').addEventListener('click',()=>{document.getElementById('aside').classList.remove('show');document.getElementById('menu-overlay').classList.remove('show');});
render();
async function refreshOnline(){
 if(location.protocol==='file:')return;
 const status=document.getElementById('live-status');status.textContent='학교알리미 확인 중';
 try{
  const codes=[...new Set(all.map(s=>s.schoolinfo_district).filter(Boolean))];
  const mapping={};for(const s of all)if(s.schoolinfo_code)mapping[s.schoolinfo_code]=s;
  const districts=await fetch('../data/districts.json').then(r=>{if(!r.ok)throw Error();return r.json()});
  const selected=districts.filter(d=>d.sido==='52'&&codes.includes(d.district));let failed=0,updated=0;
  for(const d of selected){try{const response=await fetch('/api/jeonbuk?district='+encodeURIComponent(d.code));if(!response.ok)throw Error();const result=await response.json();for(const x of result.schools){const s=mapping[x.code];if(!s||s.operational_status==='PAUSED')continue;s.studentSex=x.sex?{...x.sex,year:result.year}:null;s.library=x.library?{...x.library,year:result.year}:null;s.clubs=x.clubCounts?{...x.clubCounts,year:result.year}:null;s.specialPrograms=x.specialPrograms?{...x.specialPrograms,year:result.year}:null;s.afterSchool=x.afterSchool?{...x.afterSchool,year:result.year}:null;if(x.students&&x.classes&&x.classes.value>0)s.metrics.STUDENTS_PER_CLASS={value:Math.round(x.students.value/x.classes.value*10)/10,year:result.year,unit:'명',status:'CONFIRMED',source:'SCHOOLINFO-62-2026',note:'전체 학생 수 ÷ 전체 학급 수, 소수 첫째 자리 반올림'};s.schoolinfo_uuid=x.uuid||s.schoolinfo_uuid;s.schoolinfo_kind=x.schoolKind||null;s.address=x.address||s.address;s.founder=({'국립':'NATIONAL','공립':'PUBLIC','사립':'PRIVATE'})[x.founder]||s.founder;s.gender=({'남':'BOYS','녀':'GIRLS','여':'GIRLS','남녀공학':'COED'})[x.gender]||s.gender;for(const [v,k,unit] of [[x.students,'STUDENT_COUNT','명'],[x.classes,'CLASS_COUNT','학급']])if(v)s.metrics[k]={value:v.value,year:result.year,unit,status:'CONFIRMED',source:'SCHOOLINFO-62-2026',note:'학교알리미 원문 '+v.raw+' · 괄호 안은 특수학급·순회학급 수'};updated++}}catch{failed++}}
  status.textContent=failed?('일부 갱신 실패 · 저장자료 포함'):('학교알리미 확인 '+updated+'개교');
  if(!document.querySelector('input:focus'))render();
 }catch{status.textContent='갱신 실패 · 저장자료 표시'}
}
refreshOnline();
})();
</script>
